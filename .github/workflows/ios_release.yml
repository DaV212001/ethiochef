name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (e.g. 93)'
        required: false
        default: ''
      version_name:
        description: 'Version Name (e.g. 4.0.27)'
        required: false
        default: ''
      runner:
        description: 'macOS Runner (e.g. xcode-27, macos-latest)'
        required: false
        default: 'xcode-27'
      xcode_version:
        description: 'Xcode / iOS SDK Version (e.g. default, 27, 26.6)'
        required: false
        default: 'default'
      upload_to_testflight:
        description: 'Upload IPA to TestFlight (true/false)'
        required: false
        default: 'false'

jobs:
  build-and-release:
    name: Build & Upload IPA to TestFlight
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Inspect Available Xcode Versions
        run: |
          echo "=== Installed Xcode Applications in /Applications ==="
          ls -la /Applications | grep -i Xcode || true

      - name: Select Xcode
        if: ${{ github.event.inputs.xcode_version != '' && github.event.inputs.xcode_version != 'default' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ github.event.inputs.xcode_version }}

      - name: Verify Xcode & iOS SDK
        run: |
          echo "=== Active Xcode Version ==="
          xcodebuild -version
          echo "=== Active iOS SDK Version ==="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          export CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          export PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          python3 -c "import base64, os; open(os.environ['CERTIFICATE_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64']))"
          python3 -c "import base64, os; open(os.environ['PP_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64']))"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "Listing installed signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile UUID: $PROFILE_UUID"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Setup App Store Connect API Key
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.private_keys ~/.appstoreconnect/private_keys
          python3 -c "import base64, os; data = base64.b64decode(os.environ['APPSTORE_API_KEY_BASE64']); [open(os.path.expanduser(f'{d}/AuthKey_{os.environ[\"APPSTORE_KEY_ID\"]}.p8'), 'wb').write(data) for d in ['~/private_keys', '~/.private_keys', '~/.appstoreconnect/private_keys']]"

      - name: Configure Signing & ExportOptions.plist
        run: |
          python3 -c '
          import os, re
          name = os.environ["PROFILE_NAME"]
          with open("ios/Flutter/Release.xcconfig", "r", encoding="utf-8") as f:
              xcc = f.read()
          xcc = re.sub(r"^PROVISIONING_PROFILE_SPECIFIER\s*=.*$", f"PROVISIONING_PROFILE_SPECIFIER = {name}", xcc, flags=re.M)
          with open("ios/Flutter/Release.xcconfig", "w", encoding="utf-8") as f:
              f.write(xcc)
          with open("ios/Runner.xcodeproj/project.pbxproj", "r", encoding="utf-8") as f:
              pbx = f.read()
          pbx = re.sub(r"PROVISIONING_PROFILE_SPECIFIER\s*=\s*\"?[^\";\n]*\"?;", f"PROVISIONING_PROFILE_SPECIFIER = \"{name}\";", pbx)
          with open("ios/Runner.xcodeproj/project.pbxproj", "w", encoding="utf-8") as f:
              f.write(pbx)
          '

          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>T6N9PJTZS6</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.peacetechnology.ethiochef</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build IPA
        run: |
          BUILD_ARGS="--release --export-options-plist=ios/ExportOptions.plist"
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-number=${{ github.event.inputs.build_number }}"
          fi
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            BUILD_ARGS="$BUILD_ARGS --build-name=${{ github.event.inputs.version_name }}"
          fi
          flutter build ipa $BUILD_ARGS

      - name: Upload to TestFlight / App Store Connect
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ethiochef-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
