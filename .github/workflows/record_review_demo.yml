name: Record App Store Guideline 2.1 Demo (iOS Simulator)

on:
  workflow_dispatch:
    inputs:
      simulator_device:
        description: 'iOS Simulator Device Name or Pattern'
        required: true
        default: 'iPhone 16'
        type: string
  push:
    branches:
      - 'ci/record-review-demo'

jobs:
  record-demo:
    name: Record Guideline 2.1 Demo Video on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "Installing FFmpeg via Homebrew..."
            brew install ffmpeg || true
          fi
          command -v ffmpeg || echo "FFmpeg unavailable, will fall back to raw simulator MP4"

      - name: Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Boot Simulator & Clean Status Bar
        id: boot-sim
        run: |
          DEVICE_NAME="${{ github.event.inputs.simulator_device || 'iPhone 16' }}"
          UDID=$(python3 - "$DEVICE_NAME" <<'PY'
          import json, re, subprocess, sys
          requested = sys.argv[1].strip()
          patterns = [re.escape(requested) + r"$", re.escape(requested), r"iPhone 1[678] Pro", r"iPhone 1[678]", r"iPhone "]
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for pat_str in patterns:
              pat = re.compile(pat_str)
              for runtime, devs in sorted(data.get("devices", {}).items(), reverse=True):
                  if "iOS" not in runtime:
                      continue
                  for d in devs:
                      if d.get("isAvailable") and pat.search(d.get("name", "")):
                          print(f"Matched {d['name']} ({runtime}) -> {d['udid']}", file=sys.stderr)
                          print(d["udid"])
                          sys.exit(0)
          PY
          )

          if [ -z "$UDID" ]; then
            echo "ERROR: No available iPhone simulator found!"
            xcrun simctl list devices available
            exit 1
          fi

          echo "sim_udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork "wifi" \
            --wifiMode "active" \
            --wifiBars 3 \
            --cellularMode "active" \
            --cellularBars 4 \
            --batteryState "charged" \
            --batteryLevel 100 || true

      - name: Pre-build & Pre-grant Simulator Permissions
        run: |
          UDID="${{ steps.boot-sim.outputs.sim_udid }}"
          echo "Pre-building iOS simulator app..."
          flutter build ios --simulator --no-codesign

          echo "Installing Runner.app onto simulator $UDID..."
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          echo "Pre-granting privacy permissions to com.peacetechnology.ethiochef..."
          xcrun simctl privacy "$UDID" grant all com.peacetechnology.ethiochef || true
          xcrun simctl privacy "$UDID" grant photos com.peacetechnology.ethiochef || true
          xcrun simctl privacy "$UDID" grant camera com.peacetechnology.ethiochef || true
          xcrun simctl privacy "$UDID" grant microphone com.peacetechnology.ethiochef || true

      - name: Run Integration Test & Record Screen
        run: |
          UDID="${{ steps.boot-sim.outputs.sim_udid }}"
          RAW_VIDEO="/tmp/raw_demo.mp4"

          python3 - "$UDID" "$RAW_VIDEO" <<'PY' &
          import http.server, os, signal, subprocess, sys, time
          udid, raw_video = sys.argv[1], sys.argv[2]
          rec_proc = None

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  global rec_proc
                  if self.path == "/start":
                      if rec_proc is None:
                          print("Host recorder: Starting xcrun simctl recordVideo...", flush=True)
                          rec_proc = subprocess.Popen(
                              ["xcrun", "simctl", "io", udid, "recordVideo", "--codec=h264", raw_video]
                          )
                          deadline = time.time() + 7
                          while time.time() < deadline:
                              if os.path.exists(raw_video) and os.path.getsize(raw_video) > 0:
                                  break
                              time.sleep(0.25)
                          time.sleep(2.0)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"started")
                  elif self.path == "/stop":
                      if rec_proc is not None and rec_proc.poll() is None:
                          print("Host recorder: Stopping xcrun simctl recordVideo...", flush=True)
                          rec_proc.send_signal(signal.SIGINT)
                          try:
                              rec_proc.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              rec_proc.kill()
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"stopped")
                  else:
                      self.send_response(404)
                      self.end_headers()
              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", 45678), Handler).serve_forever()
          PY
          SERVER_PID=$!

          echo "Running Flutter Integration Test..."
          set +e
          flutter test integration_test/app_review_demo_test.dart -d "$UDID"
          TEST_EXIT_CODE=$?
          set -e

          echo "Integration test exited with code: $TEST_EXIT_CODE. Finalizing recording..."
          curl -s http://127.0.0.1:45678/stop || true
          kill -INT $(pgrep -f "recordVideo") 2>/dev/null || true
          kill "$SERVER_PID" 2>/dev/null || true
          sleep 3
          xcrun simctl shutdown "$UDID" || true

          if [ ! -f "$RAW_VIDEO" ]; then
            echo "Error: Video recording was not generated!"
            exit 1
          fi

          echo "Raw video size: $(ls -lh "$RAW_VIDEO" | awk '{print $5}')"
          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

      - name: Finalize & Compress Demo Video (< 30 MB)
        if: always()
        run: |
          RAW_VIDEO="/tmp/raw_demo.mp4"
          OUTPUT_VIDEO="ethiochef_guideline_2_1_demo.mp4"

          if [ ! -f "$RAW_VIDEO" ]; then
            echo "No raw video found to compress."
            exit 0
          fi

          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -i "$RAW_VIDEO" \
              -vf "fps=30,scale=1080:-2:flags=lanczos" \
              -c:v libx264 \
              -crf 24 \
              -preset medium \
              -profile:v high \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "$OUTPUT_VIDEO"
          else
            cp "$RAW_VIDEO" "$OUTPUT_VIDEO"
          fi

          FINAL_SIZE_BYTES=$(wc -c < "$OUTPUT_VIDEO")
          FINAL_SIZE_MB=$((FINAL_SIZE_BYTES / 1048576))
          echo "Final video ready: $OUTPUT_VIDEO (${FINAL_SIZE_MB} MB)"

          if [ "$FINAL_SIZE_MB" -ge 30 ]; then
            echo "Error: Video size exceeds 30MB limit!"
            exit 1
          fi

      - name: Upload Guideline 2.1 Demo Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethiochef-guideline-2-1-demo
          path: ethiochef_guideline_2_1_demo.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Integration Test Success
        run: |
          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Integration test failed with exit code ${TEST_EXIT_CODE:-1}."
            exit 1
          fi
